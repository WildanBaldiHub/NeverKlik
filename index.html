<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Fullscreen Link</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: sans-serif;
        }

        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Mengunci video YouTube agar memenuhi layar penuh */
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* LAPISAN PELINDUNG: Memblokir klik, klik kanan, pause, dan timeline */
        .pelindung-layar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: transparent;
        }

        /* Tombol klik pertama agar browser mengizinkan suara langsung keluar di tab biasa */
        .overlay-mulai {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 22px;
            font-weight: bold;
            z-index: 999;
            cursor: pointer;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- Tombol pemicu interaksi awal -->
    <div id="tombolMulai" class="overlay-mulai">
        Ketuk di mana saja untuk memutar video
    </div>

    <div class="video-container">
        <!-- Lapisan transparan penghalang interaksi klik/pause -->
        <div class="pelindung-layar"></div>
        
        <!-- Elemen tempat menaruh video secara otomatis -->
        <div id="videoWrapper" style="width:100%; height:100%;"></div>
    </div>

    <script>
        // =======================================================================
        // PASTE / MASUKKAN LINK UTUH VIDEO YOUTUBE ABANG DI BAWAH INI:
        // Bebas mau pakai link browser PC ataupun link tombol bagikan (share) dari HP.
        // =======================================================================
        const LINK_YOUTUBE_UTUH = "https://youtu.be/dQw4w9WgXcQ?si=PY5mOHLeCcc3OeXR"; 

        // Fungsi pintar untuk mendeteksi dan mengekstrak ID video secara otomatis dari Link Utuh
        function dapatkanIdYoutube(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        const overlay = document.getElementById('tombolMulai');
        const container = document.getElementById('videoWrapper');
        const idVideo = dapatkanIdYoutube(LINK_YOUTUBE_UTUH);

        overlay.addEventListener('click', function() {
            if (!idVideo) {
                alert("Format link YouTube yang dimasukkan salah, Bang. Periksa kembali baris kode nomor 62!");
                return;
            }

            overlay.style.display = 'none'; // Sembunyikan overlay setelah diklik
            
            // Membuat iframe secara realtime dengan injeksi parameter pengunci
            container.innerHTML = `
                <iframe 
                    src="https://youtube.com{idVideo}?autoplay=1&mute=0&controls=0&disablekb=1&rel=0&modestbranding=1&fs=0&iv_load_policy=3" 
                    allow="autoplay; encrypted-media" 
                    allowfullscreen>
                </iframe>
            `;
        });
    </script>

</body>
</html>
