<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Fullscreen Link</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: sans-serif;
        }

        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Mengunci video YouTube agar memenuhi layar penuh */
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* LAPISAN PELINDUNG (PENTING): Memblokir total interaksi klik, klik kanan, pause, dan timeline */
        .pelindung-layar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: transparent;
        }

        /* Tombol klik pertama agar browser mengizinkan suara langsung keluar saat dibuka di tab biasa */
        .overlay-mulai {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 22px;
            font-weight: bold;
            z-index: 999;
            cursor: pointer;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- Tombol pemicu awal -->
    <div id="tombolMulai" class="overlay-mulai">
        Ketuk di mana saja untuk memutar video
    </div>

    <div class="video-container">
        <!-- Lapisan transparan penghalang interaksi klik/pause -->
        <div class="pelindung-layar"></div>
        
        <!-- Elemen Video YouTube Wadah Utama -->
        <div id="videoWrapper" style="width:100%; height:100%;"></div>
    </div>

    <script>
        // GANTI dQw4w9WgXcQ DENGAN ID VIDEO YOUTUBE ABANG
        const ID_VIDEO_YOUTUBE = 'dQw4w9WgXcQ'; 

        const overlay = document.getElementById('tombolMulai');
        const container = document.getElementById('videoWrapper');

        overlay.addEventListener('click', function() {
            overlay.style.display = 'none'; // Sembunyikan overlay setelah diklik
            
            // Generate iframe langsung saat diklik agar langsung ngeplay + bersuara tanpa diblokir browser
            container.innerHTML = `
                <iframe 
                    src="https://youtube.com{ID_VIDEO_YOUTUBE}?autoplay=1&mute=0&controls=0&disablekb=1&rel=0&modestbranding=1&fs=0&iv_load_policy=3" 
                    allow="autoplay; encrypted-media" 
                    allowfullscreen>
                </iframe>
            `;
        });
    </script>

</body>
</html>
