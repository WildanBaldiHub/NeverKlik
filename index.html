<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouTube Player</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            font-family: Arial, sans-serif;
        }

        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: black;
        }

        #videoWrapper {
            width: 100%;
            height: 100%;
        }

        #videoWrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Lapisan yang menutupi seluruh video */
        .pelindung-layar {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 10;

            background: transparent;

            /* Memastikan semua klik berhenti di sini */
            pointer-events: auto;

            cursor: default;
        }

        /* Overlay awal */
        .overlay-mulai {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.96);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            color: white;
            font-size: 22px;
            font-weight: bold;

            text-align: center;

            z-index: 999;

            cursor: pointer;

            user-select: none;
        }
    </style>
</head>

<body>

    <!-- Overlay awal -->
    <div
        id="tombolMulai"
        class="overlay-mulai"
    >
        Ketuk di mana saja untuk memutar video
    </div>


    <!-- Video -->
    <div class="video-container">

        <div id="videoWrapper"></div>

        <!-- Lapisan pemblokir interaksi -->
        <div
            class="pelindung-layar"
            id="pelindung"
        ></div>

    </div>


    <script>

        // ============================================================
        // MASUKKAN LINK VIDEO YOUTUBE DI SINI
        // Bisa:
        //
        // https://youtu.be/VIDEO_ID
        // https://www.youtube.com/watch?v=VIDEO_ID
        // https://www.youtube.com/embed/VIDEO_ID
        //
        // ============================================================

        const LINK_YOUTUBE_UTUH =
            "https://youtu.be/dQw4w9WgXcQ?si=PY5mOHLeCcc3OeXR";


        // ============================================================
        // MENGAMBIL VIDEO ID YOUTUBE
        // ============================================================

        function dapatkanIdYoutube(url) {

            try {

                const parsedUrl = new URL(url);

                // Link pendek:
                // https://youtu.be/VIDEO_ID
                if (
                    parsedUrl.hostname === "youtu.be"
                ) {

                    return parsedUrl.pathname
                        .split("/")
                        .filter(Boolean)[0];

                }


                // Link biasa:
                // youtube.com/watch?v=VIDEO_ID
                if (
                    parsedUrl.pathname === "/watch"
                ) {

                    return parsedUrl.searchParams.get("v");

                }


                // Link embed:
                // youtube.com/embed/VIDEO_ID
                if (
                    parsedUrl.pathname.startsWith("/embed/")
                ) {

                    return parsedUrl.pathname
                        .split("/embed/")[1]
                        .split("/")[0];

                }


                return null;

            }

            catch (error) {

                console.error(
                    "Link YouTube tidak valid:",
                    error
                );

                return null;

            }

        }


        // ============================================================
        // AMBIL ELEMEN
        // ============================================================

        const overlay =
            document.getElementById("tombolMulai");

        const container =
            document.getElementById("videoWrapper");

        const pelindung =
            document.getElementById("pelindung");


        // ============================================================
        // AMBIL ID VIDEO
        // ============================================================

        const idVideo =
            dapatkanIdYoutube(
                LINK_YOUTUBE_UTUH
            );


        // ============================================================
        // BLOKIR INTERAKSI
        // ============================================================

        const eventYangDiblokir = [

            "click",
            "dblclick",
            "contextmenu",
            "mousedown",
            "mouseup",
            "pointerdown",
            "pointerup",
            "touchstart",
            "touchend"

        ];


        eventYangDiblokir.forEach(function(eventName) {

            pelindung.addEventListener(
                eventName,

                function(event) {

                    event.preventDefault();

                    event.stopPropagation();

                    return false;

                },

                {
                    passive: false
                }

            );

        });


        // ============================================================
        // BLOKIR KEYBOARD
        // ============================================================

        window.addEventListener(

            "keydown",

            function(event) {

                event.preventDefault();

                event.stopPropagation();

                return false;

            },

            true

        );


        // ============================================================
        // MULAI VIDEO
        // ============================================================

        overlay.addEventListener(

            "click",

            function() {

                // Cek ID video
                if (
                    !idVideo ||
                    idVideo.length !== 11
                ) {

                    alert(
                        "Link YouTube tidak valid!"
                    );

                    return;

                }


                // Sembunyikan overlay
                overlay.style.display = "none";


                // ====================================================
                // BUAT YOUTUBE EMBED
                // ====================================================

                const iframe = document.createElement(
                    "iframe"
                );


                // URL embed yang benar
                iframe.src =
                    "https://www.youtube.com/embed/"
                    +
                    idVideo
                    +
                    "?autoplay=1"
                    +
                    "&mute=0"
                    +
                    "&controls=0"
                    +
                    "&disablekb=1"
                    +
                    "&rel=0"
                    +
                    "&modestbranding=1"
                    +
                    "&fs=0"
                    +
                    "&iv_load_policy=3"
                    +
                    "&playsinline=1";


                iframe.allow =
                    "autoplay; encrypted-media";


                iframe.allowFullscreen =
                    false;


                iframe.setAttribute(
                    "frameborder",
                    "0"
                );


                // Masukkan video
                container.appendChild(
                    iframe
                );

            }

        );

    </script>

</body>
</html>
